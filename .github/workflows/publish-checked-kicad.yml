name: Publish checked Seizo Noise design
on:
  push:
    branches: [publish-kicad-20261022]
    paths: ['.github/workflows/publish-checked-kicad.yml']
permissions:
  contents: write
concurrency:
  group: seizo-noise-one-time-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: transfer
      - uses: actions/checkout@v4
        with:
          ref: main
          path: published
          fetch-depth: 1
      - name: Verify source transfer and preserve author content
        env:
          PUBLISH_DIR: ${{ github.workspace }}/published
        run: python3 transfer/.transfer/import_project.py
      - name: Install native KiCad 10
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version
      - name: Generate the two documented mechanical envelope models
        run: |
          python3 -m venv "$RUNNER_TEMP/seizo-cad"
          "$RUNNER_TEMP/seizo-cad/bin/pip" -q install cadquery==2.6.1
          "$RUNNER_TEMP/seizo-cad/bin/python" published/cad/model_sources.py
      - name: Native ERC and DRC including refill and schematic parity
        working-directory: published
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p validation fabrication/gerbers docs/schematic
          kicad-cli version | tee validation/kicad-version.txt
          kicad-cli sch erc --severity-all --exit-code-violations -o validation/ERC.rpt hardware/speakerpcb.kicad_sch
          kicad-cli pcb drc --severity-all --schematic-parity --refill-zones --save-board --exit-code-violations -o validation/DRC.rpt hardware/speakerpcb.kicad_pcb
          kicad-cli sch erc --severity-all --format json --exit-code-violations -o validation/ERC.json hardware/speakerpcb.kicad_sch
          kicad-cli pcb drc --severity-all --schematic-parity --format json --exit-code-violations -o validation/DRC.json hardware/speakerpcb.kicad_pcb
      - name: Export matching fabrication and schematic files
        working-directory: published
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          kicad-cli pcb export gerbers --layers F.Cu,B.Cu,F.Paste,B.Paste,F.SilkS,B.SilkS,F.Mask,B.Mask,Edge.Cuts -o fabrication/gerbers/ hardware/speakerpcb.kicad_pcb
          kicad-cli pcb export drill --format excellon -o fabrication/gerbers/ hardware/speakerpcb.kicad_pcb
          kicad-cli sch export svg -o docs/schematic/ hardware/speakerpcb.kicad_sch
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json, os, zipfile
          files = sorted(Path('fabrication/gerbers').glob('*'))
          assert any(p.suffix == '.drl' for p in files)
          assert any('Edge_Cuts' in p.name for p in files)
          with zipfile.ZipFile('fabrication/Seizo_Audio_Gerbers.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  if p.is_file(): z.write(p, p.name)
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          records = {str(p): sha(p) for p in sorted(Path('hardware').rglob('*')) if p.is_file()}
          summary = {'validated_at_utc': datetime.now(timezone.utc).isoformat(), 'kicad_version': Path('validation/kicad-version.txt').read_text().strip(), 'workflow_run_id': os.environ['GITHUB_RUN_ID'], 'native_erc_passed': True, 'native_drc_with_refill_and_schematic_parity_passed': True, 'physical_hardware_tested': False, 'hardware_file_sha256': records}
          Path('validation/summary.json').write_text(json.dumps(summary, indent=2)+'\n')
          PY
      - name: Commit only validated project outputs to main
        working-directory: published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md hardware docs cad images validation fabrication purchasing/BOM_engineering.csv purchasing/BOM_status.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish validated Seizo Noise KiCad design and owner screenshots"
          git push origin HEAD:main
          echo "Published commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seizo-noise-publication-checks
          path: |
            published/validation/
            published/docs/publication-integrity.json
          if-no-files-found: ignore
          retention-days: 7
